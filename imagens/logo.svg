<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64"
     role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Renan de Oliveira Farias — Desenvolvedor &amp; Técnico Maker</title>

  <!--
    Logo horizontal: marca + assinatura. Para uso em README, redes sociais e
    assinatura de e-mail. A versão só-marca está em logo-mark.svg.
  -->

  <defs>
    <linearGradient id="fullLogoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="55%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="fullLogoText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
  </defs>

  <!-- Marca -->
  <g fill="none" stroke="url(#fullLogoStroke)" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 46V18h10a7 7 0 0 1 0 14H14"/>
    <path d="M22 32l9 14"/>
    <circle cx="47" cy="32" r="13"/>
  </g>
  <circle cx="47" cy="32" r="3" fill="#ff0088"/>

  <!-- Divisor -->
  <line x1="74" y1="18" x2="74" y2="46" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Assinatura -->
  <text x="88" y="31"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-0.4"
        fill="url(#fullLogoText)">RENAN DE OLIVEIRA FARIAS</text>
  <text x="88" y="47"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="11" font-weight="500" letter-spacing="1.2"
        fill="#8a94a6">DESENVOLVEDOR &amp; TÉCNICO MAKER</text>
</svg>
